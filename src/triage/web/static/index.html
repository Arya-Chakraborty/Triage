<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage</title>
  <link rel="stylesheet" href="./styles.css">
  <script>
    (function () {
      var q = new URLSearchParams(location.search).get("theme");
      var t = q || localStorage.getItem("triage-theme");
      if (t !== "dark" && t !== "light") {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="top">
    <div class="brand">Triage</div>
    <div id="conn" class="conn" data-state="off" role="status" aria-live="polite">Disconnected</div>
    <a class="inc-count" id="inc-count" href="#/incidents" aria-label="Open incidents">0 open</a>
    <button type="button" id="theme-toggle" aria-label="Toggle color theme">Theme</button>
  </header>
  <div class="shell">
    <nav class="nav" role="tablist" aria-label="Panels">
      <a href="#/overview" role="tab" aria-controls="view">Overview</a>
      <a href="#/systems" role="tab" aria-controls="view">Systems</a>
      <a href="#/terminals" role="tab" aria-controls="view">Terminals</a>
      <a href="#/events" role="tab" aria-controls="view">Events</a>
      <a href="#/incidents" role="tab" aria-controls="view">Incidents</a>
      <a href="#/telemetry" role="tab" aria-controls="view">Telemetry</a>
    </nav>
    <main id="view" tabindex="-1" role="tabpanel" aria-label="overview"></main>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
